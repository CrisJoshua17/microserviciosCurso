apiVersion: apps/v1
kind: Deployment
metadata:
  name: mscv-oauth
spec:
  replicas: 1
  selector:
    matchLabels:
      role: mscv-oauth
  template:
    metadata:
      labels:
        role: mscv-oauth
    spec:
      containers:
        - name: mscv-oauth
          image: joshua1704/mscv-oauth:latest
          ports:
            - containerPort: 9000
          env:
            - name: LB_USUARIOS_URI
              valueFrom:
               configMapKeyRef:
                 name: msvc-usuarios
                 key: lb_usuarios_uri  
---
apiVersion: v1
kind: Service
metadata:
  name: mscv-oauth
spec:
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000
  selector:
    role: mscv-oauth
